name: check-and-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: test -f index.html
      - run: grep -q "<title>" index.html
      - name: YUVANANDHAN R
        run: |
          if grep -qi "YOUR NAME" index.html; then
            echo "You have not put your name in index.html yet."
            exit 1
          fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Show what a variable and a secret look like in a log
        run: |
          echo "variable is readable : ${{ vars.SITE_TAGLINE }}"
          echo "secret is masked     : ${{ secrets.BOARD_KEY }}"

      - name: Put the variable into the page
        run: sed -i "s|DATAEKO &middot; Week 3|${{ vars.SITE_TAGLINE }}|" index.html

      # A custom domain is set by putting a CNAME file next to index.html.
      # Held in a secret so each fork can point at its own subdomain without
      # editing the workflow. Skipped entirely when the secret is not set,
      # which is what keeps the default *.github.io URL working.
      - name: Custom domain, if one is configured
        if: env.SITE_DOMAIN != ''
        run: |
          echo "$SITE_DOMAIN" > CNAME
          echo "CNAME file written:"
          cat CNAME

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4